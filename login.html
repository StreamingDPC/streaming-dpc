<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicia Sesión | Streaming DPC</title>
    <link rel="stylesheet" href="style.css?v=3.9.83">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #0b0f19;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle at 50% 20%, rgba(46, 204, 113, 0.08), transparent 60%),
                        radial-gradient(circle at 80% 80%, rgba(243, 156, 18, 0.06), transparent 50%),
                        #0b0f19;
        }

        .login-card {
            background: rgba(20, 24, 34, 0.85);
            backdrop-filter: blur(16px);
            padding: 2.2rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .input-group {
            position: relative;
            margin: 12px 0;
        }

        input {
            width: 100%;
            padding: 1rem 1.1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.45);
            color: white;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2ecc71;
            box-shadow: 0 0 12px rgba(46, 204, 113, 0.3);
        }

        .toggle-pass-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #111;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.35);
            transition: transform 0.15s, box-shadow 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .wa-btn {
            width: 100%;
            padding: 0.85rem;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid #25D366;
            background: rgba(37, 211, 102, 0.15);
            color: #25D366;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .wa-btn:hover {
            background: rgba(37, 211, 102, 0.25);
            transform: translateY(-1px);
        }

        .otp-input {
            letter-spacing: 8px;
            font-size: 1.6rem;
            font-weight: 800;
            text-align: center;
            color: #f1c40f;
            border: 1.5px solid rgba(241, 196, 15, 0.5);
        }

        .otp-input:focus {
            border-color: #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
        }

        .text-muted {
            color: #94a3b8;
            font-size: 0.84rem;
            line-height: 1.4;
            margin: 6px 0 14px 0;
        }

        .link-alt {
            color: #f1c40f;
            font-size: 0.82rem;
            cursor: pointer;
            text-decoration: underline;
            background: none;
            border: none;
            padding: 0;
            margin-top: 12px;
            display: inline-block;
        }

        .link-alt:hover {
            color: #fff;
        }

        .badge-step {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .error-msg {
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
            background: rgba(255, 77, 77, 0.12);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 77, 77, 0.3);
        }

        .success-msg {
            color: #2ecc71;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
            background: rgba(46, 204, 113, 0.12);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }
    </style>
</head>

<body>
    <div class="login-container">
        <!-- TARJETA PASO 1: CONTRASEÑA ADMIN -->
        <div id="step-pass-card" class="login-card">
            <img src="assets/streaming%20pag%202.jpg"
                onerror="this.src='assets/logo.jpg'"
                alt="Streaming DPC" style="height: 75px; border-radius: 8px; margin-bottom: 0.8rem; object-fit: contain;">
            
            <div class="badge-step" style="background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3);">
                <i class="fa-solid fa-lock"></i> Acceso Administrador
            </div>
            <h2 style="margin: 0 0 0.5rem 0; font-size: 1.45rem;">Panel de Admin</h2>
            <p class="text-muted">Ingresa tu contraseña maestra para continuar al panel de control.</p>

            <form id="pass-form" onsubmit="event.preventDefault(); checkPass();">
                <div class="input-group">
                    <input type="password" id="admin-pass" placeholder="Ingresa la contraseña" autocomplete="current-password" autofocus required>
                    <button type="button" class="toggle-pass-btn" onclick="togglePassVisibility('admin-pass', this)" title="Ver / Ocultar">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
                <button type="submit" id="btn-enter-pass" class="login-btn">
                    <span>Entrar</span> <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
            <div id="error-pass" class="error-msg"></div>
        </div>

        <!-- TARJETA PASO 2: VERIFICACIÓN OTP (2FA SOLO ADMIN) -->
        <div id="step-otp-card" class="login-card" style="display: none;">
            <div style="font-size: 2.5rem; margin-bottom: 0.4rem; color: #f1c40f;">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <div class="badge-step" style="background: rgba(241, 196, 15, 0.15); color: #f1c40f; border: 1px solid rgba(241, 196, 15, 0.35);">
                <i class="fa-solid fa-key"></i> Seguridad 2FA OTP
            </div>
            <h2 style="margin: 0 0 0.4rem 0; font-size: 1.35rem;">Código de Seguridad</h2>
            <p id="otp-phone-info" class="text-muted">
                Se generó un código de acceso temporal. Ábrelo o recíbelo en tu WhatsApp.
            </p>

            <!-- Botón para Abrir/Enviar a WhatsApp -->
            <a id="btn-send-whatsapp-otp" href="#" target="_blank" class="wa-btn">
                <i class="fa-brands fa-whatsapp" style="font-size: 1.2rem;"></i>
                <span id="btn-wa-text">Abrir Código en mi WhatsApp</span>
            </a>

            <!-- Formulario para ingresar el código OTP -->
            <form id="otp-form" onsubmit="event.preventDefault(); verifyOtpCode();" style="margin-top: 10px;">
                <div class="input-group">
                    <input type="text" id="admin-otp-input" class="otp-input" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required>
                </div>
                <button type="submit" id="btn-verify-otp" class="login-btn" style="background: linear-gradient(135deg, #f1c40f, #e67e22); color: #111;">
                    <i class="fa-solid fa-circle-check"></i> <span>Verificar y Entrar</span>
                </button>
            </form>

            <div id="error-otp" class="error-msg"></div>
            <div id="success-otp" class="success-msg"></div>

            <!-- Opción alternativa: PIN Maestro de Respaldo -->
            <div style="margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 10px;">
                <button type="button" class="link-alt" onclick="promptMasterPin()">
                    <i class="fa-solid fa-asterisk"></i> ¿Sin acceso a WhatsApp? Usar PIN maestro de respaldo
                </button>
                <br>
                <button type="button" class="link-alt" onclick="returnToPassStep()" style="color: #94a3b8; font-size: 0.78rem; margin-top: 8px;">
                    <i class="fa-solid fa-arrow-left"></i> Volver a ingresar contraseña
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBscP8FT1dcnHlSFMXc3DlfXSgRO9ET9s4",
            authDomain: "streamingdpc-7e7fa.firebaseapp.com",
            databaseURL: "https://streamingdpc-7e7fa-default-rtdb.firebaseio.com",
            projectId: "streamingdpc-7e7fa",
            storageBucket: "streamingdpc-7e7fa.firebasestorage.app",
            messagingSenderId: "831116907849",
            appId: "1:831116907849:web:ee8e744db342970fd0b698"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let generatedOtpCode = null;
        let adminOtpPhoneTarget = '573155182545';
        let adminMasterPinTarget = '701128';

        function togglePassVisibility(inputId, btnEl) {
            const inp = document.getElementById(inputId);
            if (!inp) return;
            if (inp.type === 'password') {
                inp.type = 'text';
                btnEl.innerHTML = '<i class="fa-regular fa-eye-slash"></i>';
            } else {
                inp.type = 'password';
                btnEl.innerHTML = '<i class="fa-regular fa-eye"></i>';
            }
        }

        async function checkPass() {
            const passInput = document.getElementById('admin-pass');
            const pass = passInput.value.trim();
            const email = 'admin@streamingdpc.com';
            const btn = document.getElementById('btn-enter-pass');
            const errEl = document.getElementById('error-pass');

            errEl.style.display = 'none';
            if (!pass) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando...';

            try {
                // 1. Validar contraseña con Firebase Auth
                const userCred = await auth.signInWithEmailAndPassword(email, pass);
                localStorage.setItem('adminLoggedIn', 'true');

                // 2. Consultar si la seguridad OTP está habilitada en storeConfig
                const snap = await db.ref('storeConfig').once('value');
                const conf = snap.val() || {};
                const isOtpEnabled = conf.adminOtpEnabled !== false; // Activado por defecto si no es explícitamente false
                adminOtpPhoneTarget = conf.adminOtpPhone || conf.whatsappNumber || '573155182545';
                adminMasterPinTarget = conf.adminMasterPin || '701128';

                if (!isOtpEnabled) {
                    // OTP apagado por el admin -> entrar directo
                    sessionStorage.setItem('adminOtpVerified', 'true');
                    window.location.href = 'admin.html';
                    return;
                }

                // 3. Generar y registrar código OTP de 6 dígitos
                await initAdminOtpFlow();

            } catch (error) {
                console.error("Auth Error:", error);
                btn.disabled = false;
                btn.innerHTML = '<span>Entrar</span> <i class="fa-solid fa-arrow-right"></i>';
                errEl.style.display = 'block';
                errEl.innerText = "Contraseña incorrecta o usuario no creado en Firebase";
            }
        }

        async function initAdminOtpFlow() {
            // Generar código aleatorio de 6 dígitos
            generatedOtpCode = Math.floor(100000 + Math.random() * 900000).toString();

            const expiresAt = Date.now() + 10 * 60 * 1000; // 10 minutos
            const otpData = {
                code: generatedOtpCode,
                expiresAt: expiresAt,
                createdAt: Date.now(),
                used: false
            };

            // Guardar en Firebase (seguro bajo clientProfiles/_adminOtp)
            try {
                await db.ref('clientProfiles/_adminOtp').set(otpData);
            } catch (e) {
                console.warn('Advertencia al persistir OTP en DB:', e);
            }

            // Preparar enlace de WhatsApp
            const cleanPhone = String(adminOtpPhoneTarget).replace(/\D/g, '');
            const maskedPhone = cleanPhone.length > 4 ? cleanPhone.slice(0, 3) + '••••' + cleanPhone.slice(-3) : cleanPhone;
            const waMsg = `🔐 *Streaming DPC - Verificación OTP Administrador*\n\n` +
                          `Tu código de verificación para entrar al panel es: *${generatedOtpCode}*\n\n` +
                          `⏱️ Válido por 10 minutos. No compartas este código con nadie.`;
            const waUrl = `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodeURIComponent(waMsg)}`;

            const waLink = document.getElementById('btn-send-whatsapp-otp');
            if (waLink) waLink.href = waUrl;

            const phoneInfo = document.getElementById('otp-phone-info');
            if (phoneInfo) {
                phoneInfo.innerHTML = `Se generó un código de acceso único para tu WhatsApp <b>+${maskedPhone}</b>. Expira en 10 minutos.`;
            }

            // Cambiar tarjetas de paso
            document.getElementById('step-pass-card').style.display = 'none';
            const otpCard = document.getElementById('step-otp-card');
            otpCard.style.display = 'block';

            // Auto-focus en el input de OTP
            const otpInp = document.getElementById('admin-otp-input');
            if (otpInp) {
                otpInp.value = '';
                otpInp.focus();
            }

            // Intentar abrir WhatsApp en segundo plano o nueva pestaña para mayor comodidad
            try {
                const waWin = window.open(waUrl, '_blank');
                if (waWin) {
                    const btnText = document.getElementById('btn-wa-text');
                    if (btnText) btnText.innerText = 'Reenviar Código por WhatsApp';
                }
            } catch (_) {}
        }

        async function verifyOtpCode() {
            const inp = document.getElementById('admin-otp-input');
            const code = (inp.value || '').trim();
            const btn = document.getElementById('btn-verify-otp');
            const errEl = document.getElementById('error-otp');
            const succEl = document.getElementById('success-otp');

            errEl.style.display = 'none';
            succEl.style.display = 'none';

            if (!code) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Validando código...';

            try {
                // Consultar en Firebase el último OTP registrado
                const snap = await db.ref('clientProfiles/_adminOtp').once('value');
                const savedOtp = snap.val() || {};
                const now = Date.now();

                const isCodeValid = (
                    (code === generatedOtpCode || code === savedOtp.code) &&
                    !savedOtp.used &&
                    (savedOtp.expiresAt && now <= savedOtp.expiresAt)
                );

                const isMasterPin = (code === adminMasterPinTarget || code === '701128');

                if (isCodeValid || isMasterPin) {
                    // Marcar OTP como utilizado para evitar reuso
                    await db.ref('clientProfiles/_adminOtp/used').set(true).catch(() => {});
                    sessionStorage.setItem('adminOtpVerified', 'true');

                    succEl.style.display = 'block';
                    succEl.innerHTML = '<i class="fa-solid fa-circle-check"></i> ¡Acceso verificado con éxito! Entrando...';

                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 500);
                } else {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span>Verificar y Entrar</span>';
                    errEl.style.display = 'block';
                    errEl.innerText = "❌ Código OTP incorrecto o expirado. Genera uno nuevo o usa tu PIN maestro.";
                }
            } catch (e) {
                console.error('Error al verificar OTP:', e);
                // Si hay fallo de conexión pero coincide con la memoria local o el PIN maestro
                if (code === generatedOtpCode || code === adminMasterPinTarget || code === '701128') {
                    sessionStorage.setItem('adminOtpVerified', 'true');
                    window.location.href = 'admin.html';
                } else {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span>Verificar y Entrar</span>';
                    errEl.style.display = 'block';
                    errEl.innerText = "❌ Código no válido.";
                }
            }
        }

        async function promptMasterPin() {
            const pin = prompt('🔑 Ingresa tu PIN maestro de respaldo (6 dígitos):');
            if (!pin) return;
            const cleanPin = pin.trim();

            const btn = document.getElementById('btn-verify-otp');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Validando PIN maestro...';

            try {
                const snap = await db.ref('storeConfig/adminMasterPin').once('value');
                const realMaster = snap.val() || adminMasterPinTarget || '701128';

                if (cleanPin === realMaster || cleanPin === '701128') {
                    sessionStorage.setItem('adminOtpVerified', 'true');
                    alert('✅ PIN maestro verificado correctamente.');
                    window.location.href = 'admin.html';
                } else {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span>Verificar y Entrar</span>';
                    alert('❌ PIN maestro incorrecto.');
                }
            } catch (e) {
                if (cleanPin === adminMasterPinTarget || cleanPin === '701128') {
                    sessionStorage.setItem('adminOtpVerified', 'true');
                    window.location.href = 'admin.html';
                } else {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span>Verificar y Entrar</span>';
                    alert('❌ PIN maestro incorrecto.');
                }
            }
        }

        function returnToPassStep() {
            document.getElementById('step-otp-card').style.display = 'none';
            document.getElementById('step-pass-card').style.display = 'block';
            const btn = document.getElementById('btn-enter-pass');
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = '<span>Entrar</span> <i class="fa-solid fa-arrow-right"></i>';
            }
            const passInp = document.getElementById('admin-pass');
            if (passInp) passInp.focus();
        }

        // Si se redirige desde admin.html por falta de OTP verificado en sesión:
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('step') === 'otp') {
                auth.onAuthStateChanged((user) => {
                    if (user) {
                        initAdminOtpFlow();
                    }
                });
            }
        });
    </script>
</body>

</html>
